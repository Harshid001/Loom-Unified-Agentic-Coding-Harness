[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom-harness"
version = "0.1.0"
description = "Loom - Unified Agentic Coding Harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "tree-sitter>=0.26.0",
    "sqlite-vec>=0.1.9",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "gitpython>=3.1.0",
    "httpx>=0.25.0",
    "jinja2>=3.1.6",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.2.0",
    "prometheus-client>=0.17.0",
    "cryptography>=50.0.0",
    "pillow>=12.3.0",
    "starlette>=1.1.0",
    "pyjwt>=2.13.0",
    "urllib3>=2.7.0",
    "werkzeug>=3.1.6",
    "requests>=2.33.0",
    "python-dotenv>=1.2.2",
    "questionary>=2.1.1",
    "textual>=0.52.0",
    "redis>=5.0.0",
    "boto3>=1.35.0",
    "stripe>=7.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "redis>=5.0.0",
    "pre-commit>=3.7.0"
]

[project.scripts]
loom = "loom.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"loom/api/server.py" = ["E402", "F401", "I001"]
"loom/api/hardening.py" = ["I001"]
"loom/db/__init__.py" = ["I001"]
"loom/sandbox/command_policy.py" = ["I001"]
"scripts/production/capture_baseline.py" = ["F401", "I001"]
"scripts/production/final_release_gate.py" = ["I001"]
"tests/chaos/test_failure_recovery.py" = ["E712", "F401", "I001"]
"tests/integration/test_distributed_runtime.py" = ["F401", "I001", "W293"]
"tests/integration/test_postgres_production.py" = ["I001"]
"tests/sandbox/test_filesystem_isolation.py" = ["F401", "I001"]
"tests/security/test_authorization_matrix.py" = ["F401", "I001"]
"tests/security/test_webhooks.py" = ["I001"]
"tests/test_api.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["loom"]

[tool.mypy]
python_version = "3.10"
platform = "linux"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["loom.api.hardening"]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = ["loom.api.late_hardening"]
disable_error_code = ["method-assign", "attr-defined"]

[[tool.mypy.overrides]]
module = ["loom.api.runtime_guards"]
disable_error_code = ["no-any-return", "assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = ["loom.orchestrator.agents.verifier"]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = ["loom.api.server"]
disable_error_code = ["union-attr", "assignment", "no-any-return"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=loom --cov-report=term-missing"
