[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom-harness"
version = "0.1.0"
description = "Loom - Unified Agentic Coding Harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "tree-sitter>=0.22.0",
    "sqlite-vec>=0.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "gitpython>=3.1.0",
    "httpx>=0.25.0",
    "jinja2>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "prometheus-client>=0.17.0",
    "cryptography>=43.0.0",
    "pillow>=10.4.0",
    "starlette>=0.40.0",
    "pyjwt>=2.9.0",
    "urllib3>=2.2.2",
    "werkzeug>=3.1.6",
    "questionary>=2.0.0",
    "textual>=0.52.0",
    "redis>=5.0.0",
    "boto3>=1.35.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.1",
    "redis>=5.0.0"
]

[project.scripts]
loom = "loom.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"loom/api/hardening.py" = ["I001"]
"loom/db/__init__.py" = ["I001"]
"loom/sandbox/command_policy.py" = ["I001"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["loom.api.server"]
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = ["loom.api.hardening"]
disable_error_code = ["assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=loom --cov-report=term-missing"
