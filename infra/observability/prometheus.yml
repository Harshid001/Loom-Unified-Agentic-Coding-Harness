global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "loom-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "loom-api"
          environment: "production"

  - job_name: "loom-dashboard"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["dashboard:3000"]
        labels:
          service: "loom-dashboard"
          environment: "production"
