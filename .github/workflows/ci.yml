name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - prod-hardening-90plus
      - production-readiness/remediation
      - 'agent/**'
  pull_request:
    branches: [ main, master ]

concurrency:
  group: loom-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Python Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CI Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install "ruff==0.16.2" "mypy==2.3.0" "pytest==9.1.1" "pytest-asyncio==1.4.0" "pytest-cov==7.1.0" "pytest-timeout==2.4.0" "pip-audit==2.10.1" "redis==8.1.0"

      - name: Install Local Package
        run: pip install -e .

      - name: Dependency Vulnerability Audit (pip-audit)
        run: pip-audit --skip-editable

      - name: Run Python Linter (Ruff)
        run: ruff check loom/ tests/

      - name: Run Type Checker (Mypy)
        run: mypy loom/ --ignore-missing-imports

      - name: Run Security/Production Regression Tests
        run: pytest tests/test_security_bootstrap.py tests/test_auth_identity_binding.py tests/test_verification_state.py tests/test_usage_ledger_restart.py tests/test_command_policy.py tests/test_sandbox_security.py tests/test_production_hardening.py tests/test_webhook_secret_encryption.py tests/test_db_migrations.py tests/test_api_tokens.py --timeout=60 --timeout_method=thread

      - name: Run Full Test Suite with Coverage
        run: pytest --timeout=60 --timeout_method=thread

  frontend-checks:
    name: Next.js Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Dependency Vulnerability Audit (npm audit)
        run: npm audit --audit-level=high

      - name: Lint Frontend
        run: npm run lint

      - name: Typecheck Frontend
        run: npx tsc --noEmit

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Build Web Application
        run: npm run build

  container-build:
    name: Production Container Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build production container
        run: docker build --pull --tag loom-ci:${{ github.sha }} .

  compose-validation:
    name: Production Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose file
        run: |
          export API_KEY=ci-api-key
          export DASHBOARD_AUTH_TOKEN=ci-dashboard-token
          export POSTGRES_PASSWORD=ci-postgres-password
          export SANDBOX_WORKER_TOKEN=ci-worker-token
          export LOOM_BACKUP_ENCRYPTION_KEY=$(python -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          export LOOM_WEBHOOK_SECRET_KEY=$(python -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          export LOOM_BACKUP_S3_BUCKET=ci-backups
          export LOOM_TOKEN_TTL_SECONDS=3600
          export DOCKER_GID=$(getent group docker | cut -d: -f3 || echo 999)
          docker compose config --quiet

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  native-smoke:
    name: Native Server & CLI Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install & Verify Native CLI
        run: |
          pip install -e .
          loom version
          loom init --path .
          python -c "from loom.runtime.job_queue import RunJob; from loom.runtime.worker import RunWorker; print(RunJob.__name__, RunWorker.__name__)"
