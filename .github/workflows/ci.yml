name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - prod-hardening-90plus
      - production-readiness/remediation
      - 'agent/**'
      - 'feat/**'
      - 'remove-docker-firecracker'
  pull_request:
    branches: [ main, master ]

concurrency:
  group: loom-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Python Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install CI Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          pip install "ruff==0.16.2" "mypy==2.3.0" "pip-audit==2.10.1" "redis==8.1.0"
      - name: Dependency Vulnerability Audit
        run: pip-audit --skip-editable
      - name: Run Python Linter
        run: ruff check loom/ tests/
      - name: Run Type Checker
        run: mypy loom/ --ignore-missing-imports
      - name: Run Security Regression Tests
        run: python -m pytest tests/test_security_bootstrap.py tests/test_auth_identity_binding.py tests/test_verification_state.py tests/test_usage_ledger_restart.py tests/test_command_policy.py tests/test_sandbox_security.py tests/test_production_hardening.py tests/test_webhook_secret_encryption.py tests/test_db_migrations.py tests/test_api_tokens.py --timeout=60 --timeout_method=thread
      - name: Run Full Test Suite with Coverage
        run: python -m pytest --timeout=60 --timeout_method=thread

  frontend-checks:
    name: Next.js Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high
      - name: Lint Frontend
        run: npm run lint
      - name: Typecheck Frontend
        run: npx tsc --noEmit
      - name: Run Frontend Tests
        run: npm test
      - name: Build Web Application
        run: npm run build

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  native-smoke:
    name: Native Server & CLI Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install & Verify Native CLI
        run: |
          pip install -e .
          loom version
          loom init --path .
          python -c "from loom.runtime.job_queue import RunJob; from loom.runtime.worker import RunWorker; print(RunJob.__name__, RunWorker.__name__)"
