name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Python Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov pip-audit
          pip install -e .

      - name: Dependency Vulnerability Audit (pip-audit)
        run: pip-audit

      - name: Run Python Linter (Ruff)
        run: ruff check loom/

      - name: Run Type Checker (Mypy)
        run: mypy loom/ --ignore-missing-imports

      - name: Run Test Suite with Coverage
        run: pytest --cov=loom --cov-report=term-missing

  frontend-checks:
    name: Next.js Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Dependency Vulnerability Audit (npm audit)
        run: npm audit --audit-level=high

      - name: Lint Frontend
        run: npm run lint

      - name: Build Web Application
        run: npm run build

  docker-smoke:
    name: Docker Container Build Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker Image
        run: docker build -t loom-api:test .

      - name: Build Web Docker Image
        run: docker build -t loom-web:test ./web


