name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Python Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CI Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install ruff mypy pytest pytest-asyncio pytest-cov pytest-timeout pip-audit

      - name: Dependency Vulnerability Audit (pip-audit)
        run: pip-audit --skip-editable

      - name: Install Local Package
        run: pip install -e .

      - name: Run Python Linter (Ruff)
        run: ruff check loom/

      - name: Run Type Checker (Mypy)
        run: mypy loom/ --ignore-missing-imports

      - name: Run Test Suite with Coverage
        run: pytest --timeout=60 --timeout_method=thread

  frontend-checks:
    name: Next.js Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Dependency Vulnerability Audit (npm audit)
        run: npm audit --audit-level=high

      - name: Lint Frontend
        run: npm run lint

      - name: Typecheck Frontend
        run: npx tsc --noEmit

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Build Web Application
        run: npm run build

  native-smoke:
    name: Native Server & CLI Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install & Verify Native CLI
        run: |
          pip install -e .
          loom version
          loom init --path .


