name: Production Container Validation

on:
  push:
    branches:
      - prod-readiness
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production API image
        run: docker build --pull -t loom-api-ci .
      - name: Verify non-root runtime user
        run: test "$(docker image inspect loom-api-ci --format '{{.Config.User}}')" = "loomuser"
