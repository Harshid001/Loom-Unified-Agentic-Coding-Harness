name: Production Container Validation

on:
  push:
    branches:
      - prod-readiness
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        env:
          API_KEY: ci-placeholder-api-key
          DASHBOARD_AUTH_TOKEN: ci-placeholder-dashboard-token
          ALLOWED_REPO_ROOTS: /workspace
          DATABASE_URL: postgresql://loom:ci-placeholder@postgres:5432/loom
          REDIS_URL: redis://redis:6379/0
          LOOM_FIRECRACKER_WORKER_URL: http://firecracker-worker:8101
          LOOM_FIRECRACKER_WORKER_TOKEN: ci-placeholder-firecracker-token
          LOOM_BACKUP_ENCRYPTION_KEY: ci-placeholder-backup-key
          POSTGRES_PASSWORD: ci-placeholder-postgres-password
        run: docker compose config --quiet
      - name: Build production API image
        run: docker build --pull -t loom-api-ci .
      - name: Verify non-root runtime user
        run: test "$(docker image inspect loom-api-ci --format '{{.Config.User}}')" = "loomuser"
