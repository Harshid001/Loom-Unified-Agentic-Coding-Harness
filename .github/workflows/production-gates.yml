name: Production Release Gates

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Staging/production API base URL"
        required: true
        type: string
      repo_path:
        description: "Repository path permitted by ALLOWED_REPO_ROOTS"
        required: true
        type: string
      run_load_test:
        description: "Run the load/SLO gate against the supplied deployment"
        required: true
        default: true
        type: boolean
      run_restore_drill:
        description: "Run backup/restore drill"
        required: true
        default: true
        type: boolean
      run_firecracker_e2e:
        description: "Run Firecracker worker E2E validation"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release-gates:
    name: Production Deployment Gates
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime tooling
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .
          pip install pytest pytest-timeout httpx

      - name: Production preflight
        env:
          LOOM_ENV: production
          API_KEY: ${{ secrets.LOOM_PROD_API_KEY }}
          DASHBOARD_AUTH_TOKEN: ${{ secrets.LOOM_PROD_DASHBOARD_AUTH_TOKEN }}
          ALLOWED_REPO_ROOTS: ${{ secrets.LOOM_PROD_ALLOWED_REPO_ROOTS }}
          DATABASE_URL: ${{ secrets.LOOM_PROD_DATABASE_URL }}
          REDIS_URL: ${{ secrets.LOOM_PROD_REDIS_URL }}
          LOOM_FIRECRACKER_WORKER_URL: ${{ secrets.LOOM_PROD_FIRECRACKER_WORKER_URL }}
          LOOM_FIRECRACKER_WORKER_TOKEN: ${{ secrets.LOOM_PROD_FIRECRACKER_WORKER_TOKEN }}
          LOOM_BACKUP_ENCRYPTION_KEY: ${{ secrets.LOOM_PROD_BACKUP_ENCRYPTION_KEY }}
          LOOM_TOKEN_ADMIN_ENABLED: "false"
          RATE_LIMIT_ALLOW_LOCAL_FALLBACK: "false"
        run: python scripts/production_preflight.py

      - name: Repository production gate tests
        run: python -m pytest tests/test_production_preflight.py tests/test_production_gate_tools.py --timeout=60 --timeout_method=thread

      - name: API liveness/readiness evidence
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: python scripts/release_probe.py --base-url "${BASE_URL}" --evidence release-health-evidence.json

      - name: Load/concurrency SLO gate
        if: ${{ inputs.run_load_test }}
        env:
          BASE_URL: ${{ inputs.base_url }}
          API_KEY: ${{ secrets.LOOM_PROD_API_KEY }}
        run: |
          python scripts/load_slo_gate.py \
            --base-url "${BASE_URL}" \
            --api-key "${API_KEY}" \
            --repo-path "${{ inputs.repo_path }}" \
            --concurrency 20 \
            --requests 100 \
            --max-error-rate 0.01 \
            --max-p95 0.50 \
            --max-p99 1.00 \
            --min-throughput 10

      - name: Firecracker worker gate
        if: ${{ inputs.run_firecracker_e2e }}
        env:
          LOOM_FIRECRACKER_WORKER_URL: ${{ secrets.LOOM_PROD_FIRECRACKER_WORKER_URL }}
          LOOM_FIRECRACKER_WORKER_TOKEN: ${{ secrets.LOOM_PROD_FIRECRACKER_WORKER_TOKEN }}
          LOOM_FIRECRACKER_TEST_REPO: ${{ inputs.repo_path }}
        run: bash scripts/e2e_firecracker_validation.sh

      - name: Backup/restore drill
        if: ${{ inputs.run_restore_drill }}
        env:
          LOOM_ENV: production
          DATABASE_URL: ${{ secrets.LOOM_PROD_DATABASE_URL }}
          LOOM_BACKUP_ENCRYPTION_KEY: ${{ secrets.LOOM_PROD_BACKUP_ENCRYPTION_KEY }}
        run: |
          python scripts/restore_drill.py \
            --backup-dir "$RUNNER_TEMP/loom-backups" \
            --restore-home "$RUNNER_TEMP/loom-restore" \
            --report "$RUNNER_TEMP/restore-drill-report.json"

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-gates-${{ github.run_id }}
          path: |
            release-health-evidence.json
            ${{ runner.temp }}/restore-drill-report.json
          if-no-files-found: ignore
