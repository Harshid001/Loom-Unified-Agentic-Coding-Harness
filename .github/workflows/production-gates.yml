name: Production Release Gates

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Protected deployment environment whose secrets and approval rules should be used"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      release_ref:
        description: "Exact branch, tag or commit SHA to validate"
        required: true
        default: main
        type: string
      base_url:
        description: "Staging/production API base URL"
        required: true
        type: string
      repo_path:
        description: "Repository path permitted by ALLOWED_REPO_ROOTS"
        required: true
        type: string
      run_load_test:
        description: "Run the load/SLO gate against the supplied deployment"
        required: true
        default: true
        type: boolean
      run_restore_drill:
        description: "Run backup/restore drill"
        required: true
        default: true
        type: boolean
      run_firecracker_e2e:
        description: "Run Firecracker worker E2E validation"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: loom-production-gates-${{ inputs.target_environment }}-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  release-gates:
    name: Production Deployment Gates
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 60
    steps:
      - name: Validate release reference policy
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          if [[ "${TARGET_ENVIRONMENT}" == "production" && ! "${RELEASE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Production releases must use an immutable 40-character commit SHA." >&2
            exit 1
          fi

      - name: Checkout exact release under test
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable production checkout
        if: ${{ inputs.target_environment == 'production' }}
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_REF}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime tooling
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .
          pip install pytest pytest-timeout httpx

      - name: Record release metadata
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RELEASE_REF: ${{ inputs.release_ref }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time

          metadata = {
              "schema_version": 2,
              "timestamp": time.time(),
              "environment": os.environ["TARGET_ENVIRONMENT"],
              "requested_ref": os.environ["RELEASE_REF"],
              "resolved_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "base_url": os.environ["BASE_URL"],
              "immutable_release_required": os.environ["TARGET_ENVIRONMENT"] == "production",
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
          }
          with open("release-metadata.json", "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, indent=2)
          print(json.dumps(metadata, indent=2))
          PY

      - name: Deployment preflight
        env:
          LOOM_ENV: ${{ inputs.target_environment }}
          API_KEY: ${{ secrets.LOOM_API_KEY }}
          DASHBOARD_AUTH_TOKEN: ${{ secrets.LOOM_DASHBOARD_AUTH_TOKEN }}
          ALLOWED_REPO_ROOTS: ${{ secrets.LOOM_ALLOWED_REPO_ROOTS }}
          DATABASE_URL: ${{ secrets.LOOM_DATABASE_URL }}
          REDIS_URL: ${{ secrets.LOOM_REDIS_URL }}
          LOOM_FIRECRACKER_WORKER_URL: ${{ secrets.LOOM_FIRECRACKER_WORKER_URL }}
          LOOM_FIRECRACKER_WORKER_TOKEN: ${{ secrets.LOOM_FIRECRACKER_WORKER_TOKEN }}
          LOOM_BACKUP_ENCRYPTION_KEY: ${{ secrets.LOOM_BACKUP_ENCRYPTION_KEY }}
          LOOM_TOKEN_ADMIN_ENABLED: "false"
          RATE_LIMIT_ALLOW_LOCAL_FALLBACK: "false"
        run: python scripts/production_preflight.py

      - name: Verify PostgreSQL migrations
        env:
          DATABASE_URL: ${{ secrets.LOOM_DATABASE_URL }}
        run: python scripts/postgres_migrate.py --database-url "${DATABASE_URL}"

      - name: PostgreSQL health evidence
        env:
          DATABASE_URL: ${{ secrets.LOOM_DATABASE_URL }}
        run: python scripts/postgres_healthcheck.py --database-url "${DATABASE_URL}" --evidence postgres-health-evidence.json

      - name: Redis health evidence
        env:
          REDIS_URL: ${{ secrets.LOOM_REDIS_URL }}
        run: python scripts/redis_healthcheck.py --redis-url "${REDIS_URL}" --evidence redis-health-evidence.json

      - name: Repository deployment gate tests
        run: python -m pytest tests/test_production_preflight.py tests/test_production_gate_tools.py tests/test_deployment_health.py --timeout=60 --timeout_method=thread

      - name: API liveness/readiness evidence
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: python scripts/release_probe.py --base-url "${BASE_URL}" --evidence release-health-evidence.json

      - name: Load/concurrency SLO gate
        if: ${{ inputs.run_load_test }}
        env:
          BASE_URL: ${{ inputs.base_url }}
          API_KEY: ${{ secrets.LOOM_API_KEY }}
        run: |
          python scripts/load_slo_gate.py \
            --base-url "${BASE_URL}" \
            --api-key "${API_KEY}" \
            --repo-path "${{ inputs.repo_path }}" \
            --concurrency 20 \
            --requests 100 \
            --max-error-rate 0.01 \
            --max-p95 0.50 \
            --max-p99 1.00 \
            --min-throughput 10 \
            --evidence load-slo-evidence.json

      - name: Firecracker worker gate
        if: ${{ inputs.run_firecracker_e2e }}
        env:
          LOOM_FIRECRACKER_WORKER_URL: ${{ secrets.LOOM_FIRECRACKER_WORKER_URL }}
          LOOM_FIRECRACKER_WORKER_TOKEN: ${{ secrets.LOOM_FIRECRACKER_WORKER_TOKEN }}
          LOOM_FIRECRACKER_TEST_REPO: ${{ inputs.repo_path }}
        run: bash scripts/e2e_firecracker_validation.sh

      - name: Backup/restore drill
        if: ${{ inputs.run_restore_drill }}
        env:
          LOOM_ENV: ${{ inputs.target_environment }}
          LOOM_BACKUP_ENCRYPTION_KEY: ${{ secrets.LOOM_BACKUP_ENCRYPTION_KEY }}
        run: |
          python scripts/restore_drill.py \
            --backup-dir "$RUNNER_TEMP/loom-backups" \
            --restore-home "$RUNNER_TEMP/loom-restore" \
            --report "restore-drill-report.json"

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-gates-${{ github.run_id }}
          path: |
            release-metadata.json
            postgres-health-evidence.json
            redis-health-evidence.json
            release-health-evidence.json
            load-slo-evidence.json
            restore-drill-report.json
          if-no-files-found: ignore
