name: Disaster Recovery Restore Drill

on:
  schedule:
    # Run weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      encryption_enabled:
        description: 'Enable Fernet backup encryption during drill'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install cryptography

      - name: Run DR Restore Drill
        env:
          LOOM_BACKUP_ENCRYPTION_KEY: ${{ secrets.LOOM_BACKUP_ENCRYPTION_KEY || 'k7Z5eL7qI7Z5eL7qI7Z5eL7qI7Z5eL7qI7Z5eL7qI7Y=' }}
        run: |
          mkdir -p /tmp/loom_drill_source /tmp/loom_drill_backups /tmp/loom_drill_restore
          export LOOM_HOME="/tmp/loom_drill_source"
          
          # Populate realistic drill state
          python -c "
          import sqlite3, json, os
          from pathlib import Path
          p = Path('/tmp/loom_drill_source')
          p.mkdir(parents=True, exist_ok=True)
          conn = sqlite3.connect(p / 'records.db')
          conn.execute('CREATE TABLE runs (run_id TEXT PRIMARY KEY, org_id TEXT, status TEXT, created_at REAL)')
          conn.execute('INSERT INTO runs VALUES (\'run_drill_001\', \'org_primary\', \'completed\', 1700000000.0)')
          conn.commit()
          conn.close()
          (p / 'evidence').mkdir(exist_ok=True)
          (p / 'evidence' / 'bundle_001.json').write_text(json.dumps({'drill': True, 'verified': True}))
          "
          
          python scripts/restore_drill.py \
            --backup-dir /tmp/loom_drill_backups \
            --restore-home /tmp/loom_drill_restore \
            --report /tmp/restore-drill-report.json

      - name: Validate Drill Report & RTO/RPO SLAs
        run: |
          python -c "
          import json, sys
          report = json.loads(open('/tmp/restore-drill-report.json').read())
          print(json.dumps(report, indent=2))
          assert report['status'] == 'passed', f'Drill failed: {report}'
          assert report['backup_sha256'] != 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855', 'Placeholder empty hash detected'
          assert report['rto_seconds'] < 900.0, f'RTO SLA (>15min) violated: {report[\"rto_seconds\"]}s'
          assert report['rpo_seconds'] < 3600.0, f'RPO SLA (>1hr) violated: {report[\"rpo_seconds\"]}s'
          print('✅ DR Restore Drill passed and all SLAs verified.')
          "

      - name: Upload Drill Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-drill-report
          path: /tmp/restore-drill-report.json
          retention-days: 30
