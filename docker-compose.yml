services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      LOOM_ENV: production
      API_KEY: ${API_KEY:?API_KEY is required}
      DASHBOARD_AUTH_TOKEN: ${DASHBOARD_AUTH_TOKEN:?DASHBOARD_AUTH_TOKEN is required}
      DATABASE_URL: postgresql://loom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/loom
      REDIS_URL: redis://redis:6379/0
      ALLOWED_REPO_ROOTS: /workspace
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LOOM_SANDBOX_WORKER_URL: http://sandbox-worker:8100
      SANDBOX_WORKER_TOKEN: ${SANDBOX_WORKER_TOKEN:?SANDBOX_WORKER_TOKEN is required}
      LOOM_BACKUP_ENCRYPTION_KEY: ${LOOM_BACKUP_ENCRYPTION_KEY:?LOOM_BACKUP_ENCRYPTION_KEY is required}
      LOOM_WEBHOOK_SECRET_KEY: ${LOOM_WEBHOOK_SECRET_KEY:?LOOM_WEBHOOK_SECRET_KEY is required}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      LOOM_EVIDENCE_DIR: /app/.loom/evidence
      LOOM_TOKEN_ADMIN_ENABLED: "false"
      LOOM_TOKEN_TTL_SECONDS: ${LOOM_TOKEN_TTL_SECONDS:-86400}
      RATE_LIMIT_ALLOW_LOCAL_FALLBACK: "false"
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - /var/repos:/workspace:rw
      - evidence_data:/app/.loom/evidence
      - loom_runtime:/home/loomuser/.loom
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-worker:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev

  run-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "loom.runtime.worker"]
    environment:
      LOOM_ENV: production
      DATABASE_URL: postgresql://loom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/loom
      REDIS_URL: redis://redis:6379/0
      ALLOWED_REPO_ROOTS: /workspace
      LOOM_SANDBOX_WORKER_URL: http://sandbox-worker:8100
      SANDBOX_WORKER_TOKEN: ${SANDBOX_WORKER_TOKEN:?SANDBOX_WORKER_TOKEN is required}
      LOOM_WORKER_ID: ${LOOM_WORKER_ID:-worker-%h}
      LOOM_JOB_MAX_ATTEMPTS: ${LOOM_JOB_MAX_ATTEMPTS:-3}
      LOOM_JOB_POLL_MS: ${LOOM_JOB_POLL_MS:-5000}
      LOOM_JOB_HEARTBEAT_SECONDS: ${LOOM_JOB_HEARTBEAT_SECONDS:-30}
      LOOM_MAX_RUN_COST_USD: ${LOOM_MAX_RUN_COST_USD:-5}
      LOOM_MAX_RUN_DURATION_SECONDS: ${LOOM_MAX_RUN_DURATION_SECONDS:-1800}
      LOOM_MAX_RUN_TOKENS: ${LOOM_MAX_RUN_TOKENS:-500000}
      LOOM_EVIDENCE_DIR: /home/loomuser/.loom/evidence
    volumes:
      - /var/repos:/workspace:rw
      - evidence_data:/home/loomuser/.loom/evidence
      - loom_runtime:/home/loomuser/.loom
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-worker:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev

  sandbox-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "loom.sandbox.worker"]
    environment:
      LOOM_ENV: production
      SANDBOX_WORKER_TOKEN: ${SANDBOX_WORKER_TOKEN:?SANDBOX_WORKER_TOKEN is required}
      SANDBOX_HOST_REPO_ROOT: /var/repos
      SANDBOX_CONTAINER_REPO_ROOT: /workspace
      SANDBOX_ALLOW_NETWORK: "false"
      PORT: "8100"
    group_add:
      - ${DOCKER_GID:?DOCKER_GID is required}
    expose:
      - "8100"
    volumes:
      - /var/repos:/var/repos:rw
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${SANDBOX_WORKER_TOKEN}\" http://localhost:8100/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev

  backup-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.backup_scheduler"]
    environment:
      LOOM_ENV: production
      DATABASE_URL: postgresql://loom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/loom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      LOOM_BACKUP_ENCRYPTION_KEY: ${LOOM_BACKUP_ENCRYPTION_KEY:?LOOM_BACKUP_ENCRYPTION_KEY is required}
      LOOM_EVIDENCE_DIR: /home/loomuser/.loom/evidence
      LOOM_BACKUP_S3_BUCKET: ${LOOM_BACKUP_S3_BUCKET:?LOOM_BACKUP_S3_BUCKET is required}
      LOOM_BACKUP_S3_PREFIX: ${LOOM_BACKUP_S3_PREFIX:-loom/backups}
      LOOM_BACKUP_S3_ENDPOINT_URL: ${LOOM_BACKUP_S3_ENDPOINT_URL:-}
      LOOM_BACKUP_INTERVAL_SECONDS: ${LOOM_BACKUP_INTERVAL_SECONDS:-3600}
      LOOM_BACKUP_RETENTION_COUNT: ${LOOM_BACKUP_RETENTION_COUNT:-24}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - loom_runtime:/home/loomuser/.loom
      - evidence_data:/home/loomuser/.loom/evidence
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: loom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  evidence_data:
  loom_runtime:
